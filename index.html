<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Агрессия в переговорах</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0f11; --panel:#17191c; --line:#2a2d32; --text:#f2f2f0; --muted:#9a9ea6;
  --green:#6fdc62; --red:#ff5a45; --yellow:#f2e300; --amber:#ffb020;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;min-height:100dvh}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 32px;min-height:100dvh;display:flex;flex-direction:column}
.brand{font-weight:800;letter-spacing:.14em;font-size:12px;color:var(--muted);text-transform:uppercase}
.brand img{height:28px;display:block}
h1{font-size:30px;line-height:1.1;margin:28px 0 8px;font-weight:800}
h1 .g{color:var(--green)} h1 .r{color:var(--red)}
p{line-height:1.5;color:#d4d6da;margin:0 0 12px;font-size:15px}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}
.scale-list{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.scale-list b{font-size:18px}
label.f{display:block;font-size:13px;color:var(--muted);margin:18px 0 6px}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0b0c0e;color:var(--text);outline:none}
input[type=text]:focus{border-color:var(--green)}
.btn{display:block;width:100%;font:inherit;font-weight:700;font-size:17px;padding:16px;border-radius:12px;border:0;background:var(--green);color:#0b0c0e;cursor:pointer;margin-top:16px}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.grow{flex:1}
/* вопрос */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.count{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:12px 0 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .25s}
.qnum{margin-top:36px;font-size:13px;color:var(--muted)}
.qtext{font-size:22px;line-height:1.35;font-weight:700;margin:8px 0 28px;min-height:3.9em}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:16px;padding:15px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
.opt .n{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;flex:none}
.opt.sel{border-color:var(--green);background:#1d2a1b}
.opt.sel .n{background:var(--green);color:#0b0c0e;border-color:var(--green)}
.nav{display:flex;gap:10px;margin-top:22px}
.nav .btn{margin:0}
/* результаты */
.sec{margin:28px 0 6px;font-weight:800;font-size:18px}
.sec small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.res{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.res.out{border-color:var(--red);background:#22130f}
.rh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rn{font-weight:700;font-size:16px}
.rs{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.res.out .rs{color:var(--red)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;margin-top:4px}
.chip.ok{background:#1f3a1c;color:var(--green)} .chip.bad{background:#4a1a12;color:#ff8a78}
.scale{position:relative;height:8px;background:#26292e;border-radius:4px;margin:12px 0 4px}
.scale .ref{position:absolute;top:0;bottom:0;background:rgba(111,220,98,.35);border-left:2px solid var(--green);border-right:2px solid var(--green)}
.scale .pt{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);background:var(--text);border:2px solid var(--bg)}
.res.out .scale .pt{background:var(--red)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.rt{font-size:14px;line-height:1.5;color:#d4d6da;margin:10px 0 0}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;min-height:1em}
/* PDF */
#pdf{position:fixed;left:-10000px;top:0;width:760px;background:#fff;color:#111;font-family:Manrope,Arial,sans-serif;padding:36px 40px}
#pdf h2{margin:0 0 4px;font-size:24px}
#pdf .meta{color:#666;font-size:12px;margin-bottom:18px}
#pdf .ps{font-weight:800;font-size:15px;margin:18px 0 6px}
#pdf .pr{border:1px solid #ddd;border-radius:8px;padding:10px 12px;margin:0 0 8px;page-break-inside:avoid}
#pdf .pr.out{border-color:#e0402c;background:#fff4f2}
#pdf .ph{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
#pdf .pr.out .ph span:last-child{color:#d0301c}
#pdf .pt2{font-size:12px;line-height:1.45;margin-top:4px;color:#333}
#pdf .pb{font-size:12px;font-weight:800;letter-spacing:.14em;color:#888;margin-bottom:20px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="pdf"></div>

<script src="q1.js"></script><script src="q2.js"></script><script src="q3.js"></script><script src="q4.js"></script><script src="key.js"></script><script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
// Адрес приёмника результатов (Google Apps Script). Заполняется после развёртывания.
var ENDPOINT = (window.APP_CONFIG||{}).ENDPOINT || "";
var BRAND = '<span class="brand">Team Expert</span>';

var params = new URLSearchParams(location.search);
var GROUP = (params.get("g") || "").slice(0,80);
var KEY = "agr_v1_" + GROUP;
var OPTS = [[3,"Полностью согласен"],[2,"Скорее согласен"],[1,"Скорее не согласен"],[0,"Полностью не согласен"]];
var N = Q.length;
var st = load() || {name:"", i:0, ans:Array(N).fill(null), done:false, sent:false};
var app = document.getElementById("app");

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function render(){
  if (st.done) return renderResult();
  if (st.started) return renderQ();
  renderIntro();
}

function renderIntro(){
  app.innerHTML =
    BRAND +
    '<h1>Агрессия<br>в переговорах</h1>' +
    '<p>Вам предложены 80 утверждений. Оцените, насколько вы согласны с каждым, вспоминая переговорные ситуации на работе.</p>' +
    '<div class="card"><div class="scale-list">' +
      '<b>3</b><span>полностью согласен</span><b>2</b><span>скорее согласен</span>' +
      '<b>1</b><span>скорее не согласен</span><b>0</b><span>полностью не согласен</span>' +
    '</div></div>' +
    '<p>Отвечайте искренне. Никто в организации не будет знать ваших результатов: тренер увидит только результаты всей группы, без имён. Займёт 10–12 минут.</p>' +
    '<label class="f" for="nm">Ваше имя — только для вашего PDF, никуда не передаётся</label>' +
    '<input type="text" id="nm" maxlength="60" autocomplete="off" placeholder="Например, Анна">' +
    '<div class="grow"></div>' +
    '<button class="btn" id="go" disabled>Начать</button>';
  var nm = document.getElementById("nm"), go = document.getElementById("go");
  nm.value = st.name || "";
  go.disabled = !nm.value.trim();
  nm.oninput = function(){ go.disabled = !nm.value.trim(); };
  go.onclick = function(){ st.name = nm.value.trim(); st.started = true; save(); render(); };
}

function renderQ(){
  var i = st.i, a = st.ans[i];
  var answered = st.ans.filter(function(x){return x!==null;}).length;
  var html =
    '<div class="top">' + BRAND + '<span class="count">' + (i+1) + ' из ' + N + '</span></div>' +
    '<div class="bar"><i style="width:' + (answered/N*100) + '%"></i></div>' +
    '<div class="qnum">Утверждение ' + (i+1) + '</div>' +
    '<div class="qtext">' + esc(Q[i]) + '</div><div class="opts">';
  OPTS.forEach(function(o){
    html += '<button class="opt' + (a===o[0]?' sel':'') + '" data-v="' + o[0] + '"><span class="n">' + o[0] + '</span>' + o[1] + '</button>';
  });
  html += '</div><div class="grow"></div><div class="nav">' +
    '<button class="btn ghost" id="back"' + (i===0?' disabled':'') + '>Назад</button>' +
    '<button class="btn" id="next"' + (a===null?' disabled':'') + '>' + (i===N-1?'Результат':'Далее') + '</button></div>';
  app.innerHTML = html;
  app.querySelectorAll(".opt").forEach(function(b){
    b.onclick = function(){
      st.ans[i] = +b.dataset.v; save();
      app.querySelectorAll(".opt").forEach(function(x){x.classList.toggle("sel", x===b);});
      document.getElementById("next").disabled = false;
      if (i < N-1) setTimeout(function(){ if (st.i===i){ st.i++; save(); render(); } }, 220);
    };
  });
  document.getElementById("back").onclick = function(){ if (st.i>0){ st.i--; save(); render(); } };
  document.getElementById("next").onclick = next;
}

function next(){
  if (st.ans[st.i]===null) return;
  if (st.i < N-1){ st.i++; save(); render(); return; }
  var miss = st.ans.indexOf(null);
  if (miss >= 0){ st.i = miss; save(); render(); return; }
  st.done = true; save(); render(); send();
}

function statusLabel(r){
  if (r.status==="ok") return "В норме";
  if (r.group==="c") return r.status==="low" ? "Ниже нормы — недобор" : "Выше нормы — избыточно";
  return "Выше нормы — перебор";
}
function textFor(r){ var s = SCALES.filter(function(x){return x.id===r.id;})[0]; return s[r.status]; }

function renderResult(){
  var res = scoreAll(st.ans);
  var html = BRAND + '<h1>Ваш результат</h1><p class="muted">' + esc(st.name) + ' · ' + new Date().toLocaleDateString("ru-RU") + '</p>';
  [["c","Конструктивная агрессия","Помогает достичь результата и не разрывает контакт"],["d","Деструктивная агрессия","Вредит результату и разрывает контакт"]].forEach(function(g){
    var R = RANGE[g[0]];
    html += '<div class="sec" style="color:' + (g[0]==="c"?"var(--green)":"var(--red)") + '">' + g[1] + '<small>' + g[2] + ' · норма ' + R.lo + '–' + R.hi + '</small></div>';
    res.filter(function(r){return r.group===g[0];}).forEach(function(r){
      var out = r.status!=="ok";
      html += '<div class="res' + (out?' out':'') + '"><div class="rh"><div><div class="rn">' + r.name + '</div>' +
        '<span class="chip ' + (out?'bad':'ok') + '">' + statusLabel(r) + '</span></div><div class="rs">' + r.score + '</div></div>' +
        '<div class="scale"><div class="ref" style="left:' + (R.lo/30*100) + '%;width:' + ((R.hi-R.lo)/30*100) + '%"></div>' +
        '<div class="pt" style="left:' + (r.score/30*100) + '%"></div></div>' +
        '<div class="ticks"><span>0</span><span>30</span></div>' +
        '<p class="rt">' + textFor(r) + '</p></div>';
    });
  });
  html += '<button class="btn" id="dl">Скачать PDF</button><div class="note" id="note"></div>';
  app.innerHTML = html;
  document.getElementById("dl").onclick = function(){ makePdf(res); };
  if (!st.sent && ENDPOINT) setNote("Отправляем результат тренеру…");
}

function setNote(t){ var n = document.getElementById("note"); if (n) n.textContent = t; }

function send(){
  if (!ENDPOINT || st.sent) return;
  var res = scoreAll(st.ans);
  var payload = {group: GROUP || "без метки", scores: res.map(function(r){return {id:r.id, score:r.score, status:r.status};}), answers: st.ans};
  fetch(ENDPOINT, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(payload)})
    .then(function(){ st.sent = true; save(); setNote("Результат группы передан тренеру."); })
    .catch(function(){ setNote("Не удалось отправить результат. Проверьте интернет — попробуем ещё раз."); setTimeout(send, 5000); });
}

function makePdf(res){
  var el = document.getElementById("pdf");
  var h = '<div class="pb">TEAM EXPERT</div><h2>Агрессия в переговорах</h2><div class="meta">' + esc(st.name) + ' · ' + new Date().toLocaleDateString("ru-RU") + '</div>';
  [["c","Конструктивная агрессия — норма 15–25"],["d","Деструктивная агрессия — норма 5–15"]].forEach(function(g){
    h += '<div class="ps">' + g[1] + '</div>';
    res.filter(function(r){return r.group===g[0];}).forEach(function(r){
      h += '<div class="pr' + (r.status!=="ok"?' out':'') + '"><div class="ph"><span>' + r.name + ' — ' + r.score + ' из 30</span><span>' + statusLabel(r) + '</span></div><div class="pt2">' + textFor(r) + '</div></div>';
    });
  });
  el.innerHTML = h;
  var btn = document.getElementById("dl"); btn.disabled = true; btn.textContent = "Готовим PDF…";
  var done = function(){ btn.disabled = false; btn.textContent = "Скачать PDF"; };
  if (!window.html2pdf){ window.print(); done(); return; }
  html2pdf().set({margin:0, filename:"Агрессия_в_переговорах.pdf", image:{type:"jpeg",quality:0.95},
    html2canvas:{scale:2, backgroundColor:"#ffffff", windowWidth:760}, jsPDF:{unit:"px", format:[760,1075], hotfixes:["px_scaling"]},
    pagebreak:{mode:["css","avoid-all"]}})
    .from(el).save().then(done, done);
}

render();
if (st.done && !st.sent) send();
</script>
</body>
</html>
